<a class="sa-skip-link" href="#sa-main">Saltar al contenido</a>

<mat-sidenav-container class="sa-shell">
  <mat-sidenav mode="side" opened class="sa-shell__sidenav">
    <div class="sa-brand">
      <mat-icon aria-hidden="true">apps</mat-icon>
      <div>
        <strong>SOMOS AYNI</strong>
        <small>{{ subtitulo() }}</small>
      </div>
    </div>

    <mat-nav-list aria-label="Navegación principal">
      @for (item of items(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="sa-active">
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="sa-shell__topbar">
      <span class="sa-shell__title">Somos Ayni</span>
      <span class="sa-shell__spacer"></span>

      @if (usuario(); as u) {
        <sa-notificaciones-bell />

        <button mat-icon-button [matMenuTriggerFor]="menuCuenta" aria-label="Menú de cuenta">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #menuCuenta="matMenu" xPosition="before">
          <div class="sa-cuenta">
            <span class="sa-cuenta__email">{{ u.email }}</span>
            <span class="sa-cuenta__rol">
              @switch (u.rol) {
                @case ('TALENTO') { Talento }
                @case ('EMPRESA') { Empresa }
                @case ('ADMIN')   { Administrador }
              }
            </span>
          </div>
          <mat-divider />
          <button mat-menu-item (click)="cerrarSesion()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main id="sa-main" class="sa-shell__main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
