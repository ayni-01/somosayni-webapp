<div class="page">
  <section class="left" aria-labelledby="login-title">
    <header class="brand" aria-label="Somos Ayni">
      <span class="mark" aria-hidden="true"></span>
      <span class="name">Somos Ayni</span>
    </header>

    <div class="left-body">
      <div class="intro">
        <h1 id="login-title" class="title">Iniciar sesión</h1>
        <p class="subtitle">Bienvenido de nuevo. Ingresa para continuar.</p>
      </div>

      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Correo</mat-label>
          <span matPrefix class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <path d="M3.5 7.5l8.5 6 8.5-6" />
            </svg>
          </span>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@correo.com"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Contraseña</mat-label>
          <span matPrefix class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
          </span>
          <input
            matInput
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Mínimo 6 caracteres"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            class="toggle"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18" />
                <path d="M10.6 6.2A10.5 10.5 0 0 1 12 6c5 0 9 4 10 6-0.5 1-1.7 2.6-3.4 4" />
                <path d="M6.4 6.4C4.3 7.7 2.7 9.7 2 12c1 2 5 6 10 6 1.5 0 2.9-0.3 4.1-0.9" />
                <path d="M9.5 9.5A3 3 0 0 0 14.5 14.5" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </mat-form-field>

        <a routerLink="/auth/login" class="forgot">¿Olvidaste tu contraseña?</a>

        <button
          mat-flat-button
          color="primary"
          class="primary"
          type="submit"
          [disabled]="loading()"
        >
          Continuar
        </button>
      </form>

      <p class="signup">
        ¿No tienes cuenta?
        <a routerLink="/auth/login" class="link">Crear cuenta</a>
      </p>
    </div>
  </section>

  <section class="right" aria-label="Panel informativo">
    <div class="hero">
      <div class="illustration" role="img" aria-label="Reciprocidad y crecimiento">
        <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.25">
            <circle cx="160" cy="160" r="148" />
            <circle cx="160" cy="160" r="108" />
            <circle cx="160" cy="160" r="68" />
          </g>
          <g stroke="rgba(255,255,255,0.85)" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M88 160 Q160 92 232 160" />
            <path d="M88 160 Q160 228 232 160" />
          </g>
          <circle cx="88" cy="160" r="6" fill="#ffffff" />
          <circle cx="232" cy="160" r="6" fill="#ffffff" />
          <circle cx="160" cy="160" r="3" fill="#ffffff" />
        </svg>
      </div>

      <div class="hero-text">
        <h2>El talento y las empresas se conectan aquí.</h2>
        <p>
          Resuelve retos reales, evalúa con evidencia y construye relaciones laborales basadas en
          hechos.
        </p>
      </div>
    </div>
  </section>
</div>
