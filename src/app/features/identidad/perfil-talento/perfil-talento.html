<section class="sa-perfil">
  <header class="sa-perfil__header">
    <h1>Mi perfil profesional</h1>
    <p>Completa tu información para que las empresas conozcan tu trayectoria.</p>
  </header>

  @if (cargando()) {
    <p class="sa-perfil__cargando">Cargando perfil...</p>
  } @else {
    <form class="sa-form" [formGroup]="form" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre completo</mat-label>
        <input matInput formControlName="nombreCompleto" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ubicación</mat-label>
        <input matInput formControlName="ubicacion" placeholder="Ej: Lima, Perú">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Sobre mí</mat-label>
        <textarea matInput formControlName="sobreMi" rows="6" maxlength="500"></textarea>
        <mat-hint align="end">{{ form.controls.sobreMi.value?.length ?? 0 }}/500</mat-hint>
      </mat-form-field>

      <footer class="sa-perfil__footer">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
          @if (guardando()) {
            Guardando...
          } @else {
            Guardar cambios
          }
        </button>
      </footer>
    </form>
  }
</section>
